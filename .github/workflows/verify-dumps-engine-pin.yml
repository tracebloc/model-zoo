name: Verify dumps against engine pin

# Prevention half of backend#2641 (backend#2658). A prepped <base>_weights.pkl
# state_dict's key layout is decided by the transformers/timm/torchvision
# version that built the module tree, and the engine strict-loads seeds. So a
# dump built under a different version than the engine pins is a silent,
# edge-only training abort. This gate rebuilds each shipped template under the
# ENGINE's pin and strict-loads the staged dump into it, and fails if the
# engine pin drifts from what the dumps were built with.

on:
  pull_request:
    branches: [develop]
    paths:
      - "model_zoo/**"
      - "tools/prep_offline_weights.py"
      - "tools/verify_dumps_against_engine_pin.py"
      - "tools/check_engine_pin_drift.py"
      - "tools/derive_seed_excluded.py"
      - "tools/seed_contract.py"
      - "tools/seed_index.py"
      - "tools/check_dump_coverage.py"
      - "tools/requirements-engine-pin.txt"
      - "manifest.json"
      - ".github/workflows/verify-dumps-engine-pin.yml"
  push:
    branches: [develop]
    paths:
      - "model_zoo/**"
      - "tools/prep_offline_weights.py"
      - "tools/verify_dumps_against_engine_pin.py"
      - "tools/check_engine_pin_drift.py"
      - "tools/derive_seed_excluded.py"
      - "tools/seed_contract.py"
      - "tools/seed_index.py"
      - "tools/check_dump_coverage.py"
      - "tools/requirements-engine-pin.txt"
      - "manifest.json"
      - ".github/workflows/verify-dumps-engine-pin.yml"
  # An engine transformers bump invalidates hosted seeds WITHOUT touching this
  # repo. The scheduled run makes the drift guard go red on such a bump even
  # with no model-zoo change, so a seed-invalidating change fails loudly rather
  # than stranding every dump silently (backend#2658 acceptance).
  schedule:
    - cron: "17 6 * * 1-5"
  workflow_dispatch:
    inputs:
      engine-ref:
        description: "tracebloc-engine ref to pin against"
        default: develop

concurrency:
  group: verify-dumps-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ENGINE_REF: ${{ github.event.inputs.engine-ref || 'develop' }}

jobs:
  # 1a) Fetch the engine's pin files in an ISOLATED job that runs NO PR-controlled
  #     code. The contents:read App token for private tracebloc-engine is minted
  #     and used ONLY here, alongside trusted actions (create-github-app-token,
  #     checkout, upload-artifact). Because nothing from the PR executes in this
  #     job, the token — even as it sits in the runner's step-output files — is
  #     never reachable by PR code. The two pin files are handed to the guard
  #     job below as an artifact; the token itself never leaves this job.
  fetch-engine-pin:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      # tracebloc-engine is a separate private repo; GITHUB_TOKEN cannot read it.
      # Mint an installation token scoped to that one repo, contents:read only
      # (same App as add-to-kanban.yml, least-privilege per backend#2166).
      - name: Mint an engine-read token
        id: engine-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: tracebloc-engine
          permission-contents: read
      - name: Check out the engine pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/tracebloc-engine
          ref: ${{ env.ENGINE_REF }}
          token: ${{ steps.engine-token.outputs.token }}
          path: _engine
          # Belt and braces: don't persist the token into _engine/.git/config
          # either. The real isolation is that no PR code runs in this job.
          persist-credentials: false
          sparse-checkout: |
            use_cases/requirements.txt
            use_cases/requirements_cuda.txt
          sparse-checkout-cone-mode: false
      - name: Upload the engine pin files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-pin
          # Only the two requirements files — never _engine/.git — cross to the
          # PR-controlled job.
          path: |
            _engine/use_cases/requirements.txt
            _engine/use_cases/requirements_cuda.txt
          if-no-files-found: error
          retention-days: 1

  # 1b) The mirror tools/requirements-engine-pin.txt must EQUAL the engine's live
  #     pin. This job runs the PR-controlled drift checker (check_engine_pin_drift
  #     imports verify_dumps_against_engine_pin), but holds NO engine token — it
  #     only receives the two pin files as an artifact from the isolated fetch job
  #     above. So even PR-modified code here has nothing to reach private
  #     tracebloc-engine with. This is what makes the mirror safe to install from
  #     and what turns an engine `transformers` bump red until the mirror (and
  #     then the dumps) are regenerated.
  engine-pin-drift-guard:
    needs: fetch-engine-pin
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the engine pin files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: engine-pin
          path: _engine_pin
      - name: Assert the mirror matches the engine's pin
        run: |
          python3 tools/check_engine_pin_drift.py \
            --mirror tools/requirements-engine-pin.txt \
            --engine _engine_pin/requirements.txt \
            --engine _engine_pin/requirements_cuda.txt

  # 2) Rebuild each shipped template under the engine pin and strict-load its
  #    staged dump. Fails closed on any KEY_MISMATCH / BUILD_FAIL / provenance
  #    drift. Runs only after the mirror is confirmed == the engine.
  verify-dumps:
    needs: engine-pin-drift-guard
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements-engine-pin.txt
      # Install the engine's pinned stack (guard above proved it == the engine).
      # A failure here is a hard error, never a swallowed green (fail-closed).
      - run: pip install -r tools/requirements-engine-pin.txt
      # Obtain the staged dumps. They are NOT committed (served from the
      # tracebloc model store; hosting is backend#2659). tools/sync_zoo_weights.py
      # is the fetch hook (backend#2658 refs) and fetches the
      # <base>_weights.pkl files into ./dist.
      #
      # Each precondition is reported BY NAME. The previous guard was a single
      # `[ -f manifest.json ] && [ -f tools/sync_zoo_weights.py ]`, which
      # attributed every no-op to hosting — including the case where the fetch
      # hook itself was not in the repo. It was: the tool existed only as an
      # uncommitted file on one laptop, so `-f` selected the no-op branch on
      # every run and printed a reassuring hosting message, which is why the
      # gap survived unnoticed (backend#3060). A missing tool and an undecided
      # bucket are different problems and now say so.
      #
      # Still exit 0 in every skip branch: verify_dumps_against_engine_pin.py
      # owns the fail-closed decision (armed-green on an ABSENT manifest, red on
      # a manifest present with dumps it cannot account for), and duplicating
      # that judgement here is how the two drift apart.
      - name: Obtain staged dumps from the model store
        env:
          # The store URI is backend#2659's decision, so it is configuration and
          # not a literal here. Unset resolves to the empty string and selects
          # the "no store URI" branch below.
          TRACEBLOC_ZOO_WEIGHTS_URI: ${{ vars.TRACEBLOC_ZOO_WEIGHTS_URI }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ ! -f manifest.json ]; then
            echo "SKIP (no manifest): no manifest.json in the checkout, so no"
            echo "  dumps are declared for verification. The gate is armed and"
            echo "  activates when a manifest lands. Not a defect."
          elif [ ! -f tools/sync_zoo_weights.py ]; then
            echo "SKIP (no sync tool): manifest.json declares dumps, but the"
            echo "  fetch hook tools/sync_zoo_weights.py is NOT in this checkout."
            echo "  This is a DEFECT in the repo, not a pending decision — the"
            echo "  hook is committed (backend#3060); restore it. The verifier"
            echo "  below will report every declared dump as MISSING."
          elif [ -z "${TRACEBLOC_ZOO_WEIGHTS_URI:-}" ]; then
            echo "SKIP (no store URI): manifest.json and the fetch hook are both"
            echo "  present, but TRACEBLOC_ZOO_WEIGHTS_URI is unset, so there is"
            echo "  nowhere to fetch from. THIS is the hosting decision —"
            echo "  backend#2659. Set the repo variable once the store exists."
          else
            python3 tools/sync_zoo_weights.py --staging . fetch-all --dest dist
          fi
      # The gate. Exits non-zero on any dump that cannot strict-load into its
      # template under the engine pin, or any built_with-vs-engine drift.
      - run: python3 tools/verify_dumps_against_engine_pin.py

  # 3) SEED_EXCLUDED_PREFIXES must keep agreeing with what the template BUILDS.
  #
  #    The constant is a literal, and a literal rots. `seed_contract.py apply`
  #    runs once, at authoring time; from then on the templates restate a
  #    derivation that nothing re-runs. Rename `fc.` to `head.`, add a layer, and
  #    the declaration is quietly wrong -- after which a seed either carries head
  #    weights it must not, or excludes keys that no longer exist. That is the
  #    failure the backbone-only contract exists to remove, coming back through
  #    the declaration instead of the load (Lukas, model-zoo#217).
  #
  #    So the derivation is the CHECK rather than the authoring step. It runs
  #    under the ENGINE's pinned stack for the same reason `verify-dumps` does: a
  #    head's shape is decided by the libraries that build the module tree, so a
  #    derivation under any other stack describes a model nobody runs.
  #
  #    SCOPE IS DELIBERATE. Each template is BUILT TWICE, so re-deriving all 46
  #    every PR is ~92 model builds -- slow enough that people would route around
  #    it. A PR re-derives only the templates it TOUCHES, which is exactly where
  #    drift is introduced; the scheduled run re-derives everything, which is
  #    where a drift introduced any other way gets caught.
  seed-contract-drift:
    needs: engine-pin-drift-guard
    # 60, not 30, and the reason is the full-sweep path rather than the common
    # one. A PR touching a few templates finishes in minutes; a PR touching the
    # seed-contract TOOLING re-derives all ~140, and each is BUILT TWICE. That
    # measured ~30 minutes locally with a warm cache, which is exactly the
    # budget -- so the sweep this gate exists for would be the run that times
    # out, and a timeout reads as a broken gate rather than a slow one.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `git diff base...HEAD` needs the merge base, not a shallow tip.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements-engine-pin.txt
      # The drift guard above proved this mirror == the engine's live pin.
      - run: pip install -r tools/requirements-engine-pin.txt
      - name: Decide which templates to re-derive
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "reason=full sweep (${{ github.event_name }})" >> "$GITHUB_OUTPUT"
            echo "only=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="origin/${{ github.base_ref }}"
          changed="$(git diff --name-only "$base...HEAD")"
          # A change to the tooling can move EVERY answer, so it forces a full
          # sweep -- narrowing to touched templates there would be checking the
          # new tool against the files least likely to expose its bug.
          #
          # THE PIN COUNTS AS TOOLING, and missing that was a real hole (Bugbot):
          # a head's shape is decided by the LIBRARY VERSIONS that build the
          # module tree, so bumping `requirements-engine-pin.txt` can stale every
          # prefix while the dumps still strict-load at each template's default.
          # That PR triggers this workflow via `paths:` but touches no template,
          # so it would have exited "nothing to re-derive" and gone green on the
          # one change most able to invalidate the constants. The weekday sweep
          # would find it eventually; the PR that caused it would not.
          #
          # The workflow file is here for the same reason: editing the gate
          # should re-run the gate in full, not trust it narrowed correctly.
          if echo "$changed" | grep -qE '^(tools/(derive_seed_excluded|seed_contract|seed_index)\.py|tools/requirements-engine-pin\.txt|\.github/workflows/verify-dumps-engine-pin\.yml)$'; then
            echo "reason=full sweep (seed-contract tooling or engine pin changed)" >> "$GITHUB_OUTPUT"
            echo "only=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `|| true` because grep exits 1 on NO MATCH, and `pipefail` would
          # turn "this PR touches no template" into a failed job. `-e` on each
          # path drops templates the PR DELETED -- `--only` on a stem that no
          # longer exists makes the derivation exit 2.
          stems=""
          while IFS= read -r f; do
            [ -n "$f" ] && [ -e "$f" ] && stems="$stems $(basename "$f" .py)"
          done <<EOF
          $(echo "$changed" | grep -E '^model_zoo/[^/]+/pytorch/[^/]+\.py$' || true)
          EOF
          # DEDUPE ONLY IF THERE IS SOMETHING TO DEDUPE (Bugbot). Running the
          # empty string through `tr | sort -u | tr` yields a single SPACE, not
          # "", so `[ -z "$only" ]` never held and `${only:+--only $only}` still
          # emitted a bare `--only` -- which made a PR touching no template
          # re-derive the entire zoo, the exact opposite of this step's purpose.
          #
          # My first "proof" of this step printed "${stems## }", which strips the
          # leading space and so displayed [] for a value that was " ". The test
          # below asserts the RAW length instead.
          if [ -n "${stems// /}" ]; then
            stems="$(echo "$stems" | tr ' ' '\n' | sort -u | tr '\n' ' ')"
            stems="${stems# }"
            stems="${stems% }"
          else
            stems=""
          fi
          echo "reason=changed templates: ${stems:-none}" >> "$GITHUB_OUTPUT"
          echo "only=$stems" >> "$GITHUB_OUTPUT"
      - name: Re-derive and compare against the declared constants
        run: |
          set -euo pipefail
          echo "Scope: ${{ steps.scope.outputs.reason }}"
          only="${{ steps.scope.outputs.only }}"
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -z "$only" ] \
             && ! echo "${{ steps.scope.outputs.reason }}" | grep -q '^full sweep'; then
            echo "No template touched — nothing to re-derive."
            exit 0
          fi
          # $only is a deliberate word-split list of template stems.
          # shellcheck disable=SC2086
          python3 tools/derive_seed_excluded.py --zoo . --out seed_derived.json \
            ${only:+--only $only}
          python3 tools/seed_contract.py --zoo . check --verdict seed_derived.json

  # backend#2659 — THE COMPLEMENT DIRECTION. Every other gate in this workflow is
  # keyed on the dumps that exist and asks "are they good?". None asks "is there
  # one for every template that needs one?", so a template that was migrated but
  # never prepped passes them all BY BEING ABSENT, and trains from random init on
  # an edge while the migration's premise is that it does not. Two slipped
  # through exactly this way: `faster_rcnn_resnet` and, found by this gate,
  # `text_classification/bert_base_uncased`.
  #
  # DELIBERATELY INDEPENDENT OF THE ENGINE PIN, and of every other job here bar
  # its own manifest fetch. The check is template text and set arithmetic — no
  # torch, no transformers, no build — so it runs in seconds on stdlib alone.
  # Making it `needs:` a pin guard would let a slow or red pin hide a coverage
  # answer that does not depend on the pin at all.
  #
  # It DOES now `needs:` job 4a below, and that is not a walk-back of the line
  # above: 4a is a 10-second sparse checkout of one 9 KB JSON file, it carries
  # no torch and no pin, and the dependency exists to keep the `backend` token
  # out of this job rather than to order any work. The property being protected
  # is which job the token lives in, not how fast the answer arrives.
  # 4a) THE TOKEN LIVES IN ITS OWN JOB, and that split is the security boundary,
  #     not a tidiness preference. This job mints a `backend`-scoped App token
  #     and runs NO PR-controlled code; the coverage job below runs the
  #     PR-controlled checker and holds NO token. Collapsing the two lets a PR
  #     that edits `tools/check_dump_coverage.py` read private `backend`:
  #     `persist-credentials: false` keeps the token out of `_backend/.git/config`
  #     but NOT out of the runner's step-output files, so it is reachable from
  #     any code running in the same job.
  #
  #     This is exactly the `fetch-engine-pin` / `engine-pin-drift-guard` pair
  #     above, for the same reason and with the same shape — "the real isolation
  #     is that no PR code runs in this job". The first revision of backend#2985
  #     armed the manifest read inside the coverage job and reintroduced the
  #     hazard that pattern exists to prevent; Cursor Bugbot caught it on a
  #     learned rule naming this repo's own token-split convention.
  fetch-dump-manifest:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Mint a backend-read token
        id: backend-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: backend
          permission-contents: read
      - name: Check out the dump manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/backend
          ref: develop
          token: ${{ steps.backend-token.outputs.token }}
          path: _backend
          # Belt and braces: don't persist the token into _backend/.git/config
          # either. The real isolation is that no PR code runs in this job.
          persist-credentials: false
          sparse-checkout: tools/offline_weights/manifest.json
          sparse-checkout-cone-mode: false
      # FAIL IF THE SPARSE CHECKOUT MATCHED NOTHING, here as well as in the
      # consumer. A miss would otherwise upload an empty artifact and the
      # failure would surface one job later as a confusing download error.
      - name: The manifest must actually be present
        run: test -s _backend/tools/offline_weights/manifest.json
      - name: Upload the dump manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dump-manifest
          # Only manifest.json — never _backend/.git — crosses to the
          # PR-controlled job.
          path: _backend/tools/offline_weights/manifest.json
          if-no-files-found: error
          retention-days: 1

  # 4b) The coverage answer itself. Runs the PR-controlled checker with NO token
  #     of any kind: the manifest arrives as an artifact from 4a, so even
  #     PR-modified code here has nothing to reach private `backend` with.
  dump-coverage:
    needs: fetch-dump-manifest
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # backend#2985 — THE ORPHAN HALF IS NOW ARMED, and the reason it had to be
      # is that eight orphans accumulated while it was not. `check_dump_coverage`
      # is fail-closed BOTH ways by its own docstring, but this step passed no
      # `--manifest`, so `have_inventory` was false and the orphan branch never
      # executed. THAT IS WHY A HUMAN HAD TO NOTICE the seven retired DETR seeds
      # and `mask_rcnn`: the guard written to catch exactly this was here, green,
      # and running only half of itself.
      #
      # The manifest lives in `backend`, not here, which is the whole reason it
      # was left out: the previous comment said "on hosting, add --manifest",
      # and hosting (backend#2659) is not what supplies it — a cross-repo read
      # is. Job 4a performs that read; this job only consumes its artifact.
      #
      # STILL NO `--dumps-dir`: the store's blobs are not reachable from CI
      # (backend#2659 is open — TRACEBLOC_ZOO_WEIGHTS_URI is unset). The
      # manifest is the right inventory to gate on anyway. It is the artifact a
      # PR review can see, and backend#2985 is what happens when it and the
      # store disagree: gate the reviewable side, and the store is reconciled to
      # it by `tools/offline_weights/prune_dumps.py`.
      - name: Download the dump manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dump-manifest
          path: _manifest
      # FAIL IF THE MANIFEST IS NOT THERE, rather than falling through to the
      # classification-only run. An artifact that silently arrived empty would
      # restore the exact unarmed state this step exists to end, and it would
      # read as green — which is the defect, not a degraded mode of it.
      - name: The manifest must actually be present
        run: test -s _manifest/manifest.json
      - name: Every migrated template accounts for its seed, and every dump a template
        run: |
          python3 tools/check_dump_coverage.py --zoo . \
            --manifest _manifest/manifest.json
