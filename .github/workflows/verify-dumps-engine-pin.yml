name: Verify dumps against engine pin

# Prevention half of (internal ref). A prepped <base>_weights.pkl
# state_dict's key layout is decided by the transformers/timm/torchvision
# version that built the module tree, and the engine strict-loads seeds. So a
# dump built under a different version than the engine pins is a silent,
# edge-only training abort. This gate rebuilds each shipped template under the
# ENGINE's pin and strict-loads the staged dump into it, and fails if the
# engine pin drifts from what the dumps were built with.

# THERE ARE TWO MIRRORS OF THE ENGINE'S PIN, and for a long time this gate
# watched only one (internal ref). `tools/requirements-engine-pin.txt` is what prep and
# `verify-dumps` install; `.github/requirements/pytorch.txt` is what ci.yml's
# REQUIRED `test-pytorch` job installs, and its own header carries the rule —
# "Bump these together with the engine's pins, never ahead of them". Nothing
# enforced that header: the `paths:` lists below did not name the file, so a
# lone bump there fired no job, and the guard step had a single `--mirror`
# pointed at the tools/ copy, so it would not have looked even if it had run.
# (internal ref) is the proof case — as dependabot opened it, it touched only
# pytorch.txt, sat two minors ahead of the engine, and was all green. Both
# halves are fixed below: the trigger, and the invocation.
on:
  pull_request:
    branches: [develop]
    paths:
      - "model_zoo/**"
      - "tools/prep_offline_weights.py"
      - "tools/verify_dumps_against_engine_pin.py"
      - "tools/check_engine_pin_drift.py"
      - "tools/derive_seed_excluded.py"
      - "tools/seed_contract.py"
      - "tools/seed_index.py"
      - "tools/check_dump_coverage.py"
      - "tools/sync_zoo_weights.py"
      - "tools/requirements-engine-pin.txt"
      # The whole directory, not just pytorch.txt: a new CI requirement set
      # that mirrors an engine pin must arrive INSIDE the trigger, or it
      # repeats (internal ref) exactly. The guard job checks only the files that
      # actually mirror the engine, and a test asserts that set is complete.
      - ".github/requirements/**"
      - "manifest.json"
      - ".github/workflows/verify-dumps-engine-pin.yml"
  push:
    branches: [develop]
    paths:
      - "model_zoo/**"
      - "tools/prep_offline_weights.py"
      - "tools/verify_dumps_against_engine_pin.py"
      - "tools/check_engine_pin_drift.py"
      - "tools/derive_seed_excluded.py"
      - "tools/seed_contract.py"
      - "tools/seed_index.py"
      - "tools/check_dump_coverage.py"
      - "tools/sync_zoo_weights.py"
      - "tools/requirements-engine-pin.txt"
      - ".github/requirements/**"
      - "manifest.json"
      - ".github/workflows/verify-dumps-engine-pin.yml"
  # An engine transformers bump invalidates hosted seeds WITHOUT touching this
  # repo. The scheduled run makes the drift guard go red on such a bump even
  # with no model-zoo change, so a seed-invalidating change fails loudly rather
  # than stranding every dump silently (an internal ticket acceptance).
  schedule:
    - cron: "17 6 * * 1-5"
  workflow_dispatch:
    inputs:
      engine-ref:
        description: "tracebloc-engine ref to pin against"
        default: develop

concurrency:
  group: verify-dumps-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ENGINE_REF: ${{ github.event.inputs.engine-ref || 'develop' }}

jobs:
  # 1a) Fetch the engine's pin files in an ISOLATED job that runs NO PR-controlled
  #     code. The contents:read App token for private tracebloc-engine is minted
  #     and used ONLY here, alongside trusted actions (create-github-app-token,
  #     checkout, upload-artifact). Because nothing from the PR executes in this
  #     job, the token — even as it sits in the runner's step-output files — is
  #     never reachable by PR code. The two pin files are handed to the guard
  #     job below as an artifact; the token itself never leaves this job.
  fetch-engine-pin:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      # tracebloc-engine is a separate private repo; GITHUB_TOKEN cannot read it.
      # Mint an installation token scoped to that one repo, contents:read only
      # (same App as add-to-kanban.yml, least-privilege per (internal ref)).
      - name: Mint an engine-read token
        id: engine-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: tracebloc-engine
          permission-contents: read
      - name: Check out the engine pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/tracebloc-engine
          ref: ${{ env.ENGINE_REF }}
          token: ${{ steps.engine-token.outputs.token }}
          path: _engine
          # Belt and braces: don't persist the token into _engine/.git/config
          # either. The real isolation is that no PR code runs in this job.
          persist-credentials: false
          # THE SEARCH SPACE, NOT A FILE LIST (internal ref). These two
          # patterns used to be two exact paths, `use_cases/requirements.txt`
          # and `use_cases/requirements_cuda.txt`, and that pair WAS this
          # repo's claim about which engine files carry a pin. It was wrong:
          # the engine pins torch in five files and something a mirror mirrors
          # in seven, and `use_cases/requirements_vision_cv_cuda.txt` — the
          # torch version of the `cv:gpu` base image, which
          # `Dockerfile.base.cv.gpu` greps its pin out of — was in neither
          # path, so no gate here had ever compared a mirror against it. An
          # unread source cannot disagree.
          #
          # So the whole space is fetched and `check_engine_pin_drift.py`
          # DERIVES which of it pins anything (`_ENGINE_SOURCE_GLOBS`, kept
          # equal to these patterns by a test). Fetching files that pin nothing
          # is the point, not waste: the derivation has to be able to see that
          # the three GPU Dockerfiles pin torch via a cu129 wheel index rather
          # than a literal `pkg==ver`, and a candidate never fetched is
          # indistinguishable from one that pins nothing.
          #
          # LEADING SLASHES ANCHOR THESE AT THE ENGINE'S ROOT. Non-cone sparse
          # patterns are gitignore-style, where a pattern with no slash matches
          # at ANY depth — `Dockerfile.base.*` unanchored would also pull a
          # vendored `sub/Dockerfile.base.cpu`, which `Path.glob` on the
          # consuming side would not then match.
          sparse-checkout: |
            /Dockerfile.base.*
            /use_cases/requirements*.txt
          sparse-checkout-cone-mode: false
      - name: Upload the engine pin files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-pin
          # Only the pin files — never _engine/.git — cross to the
          # PR-controlled job.
          #
          # `_engine/Dockerfile.base.*` IS LOAD-BEARING FOR THE LAYOUT, not
          # only for coverage: upload-artifact roots the archive at the least
          # common ancestor of the paths it is given. With only
          # `_engine/use_cases/...` that was `_engine/use_cases`, and the guard
          # job saw `_engine_pin/requirements.txt`; with a root-level
          # Dockerfile pattern it is `_engine`, so the paths keep their
          # `use_cases/` segment and `--engine-root _engine_pin` globs the same
          # relative shape the engine has. Dropping the Dockerfile pattern
          # would silently re-flatten it.
          path: |
            _engine/Dockerfile.base.*
            _engine/use_cases/requirements*.txt
          if-no-files-found: error
          retention-days: 1

  # 1b) The mirror tools/requirements-engine-pin.txt must EQUAL the engine's live
  #     pin. This job runs the PR-controlled drift checker (check_engine_pin_drift
  #     imports verify_dumps_against_engine_pin), but holds NO engine token — it
  #     only receives the two pin files as an artifact from the isolated fetch job
  #     above. So even PR-modified code here has nothing to reach private
  #     tracebloc-engine with. This is what makes the mirror safe to install from
  #     and what turns an engine `transformers` bump red until the mirror (and
  #     then the dumps) are regenerated.
  engine-pin-drift-guard:
    needs: fetch-engine-pin
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `git show <merge base>:<mirror>` needs history, not a shallow tip.
          # It is what lets the drift report DERIVE which side moved instead of
          # asserting one (internal ref); see the base-extraction step below.
          fetch-depth: 0
      - name: Download the engine pin files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: engine-pin
          path: _engine_pin
      # ONE INVOCATION PER MIRROR, deliberately, rather than one multi-mirror
      # call: the failure header names the file it was handed, so a red job
      # says WHICH copy drifted instead of that "a" copy did.
      #
      # AND THE LOOP DOES NOT STOP AT THE FIRST FAILURE. An engine bump moves
      # both mirrors at once, so `set -e` on the first check would report half
      # the work and hide the rest until the next round-trip. Each exit status
      # is collected and the step exits non-zero if ANY mirror drifted.
      #
      # The mirror list is the ONLY place these two files are named together;
      # tests/test_engine_pin_drift_guard.py reads it back out of this YAML and
      # fails if a file under .github/requirements/ mirrors an engine pin
      # without appearing here.
      #
      # `--mirror-at-base` IS WHAT MAKES THE DIAGNOSIS DERIVED RATHER THAN
      # ASSERTED (internal ref). Two pins cannot say which side moved, and
      # the old message asserted "the engine moved" in both directions — which
      # on a mirror-moved PR sent you to regenerate the mirror back down to
      # the engine's older pin and silently revert the bump (internal ref). The
      # mirror's own value at the merge base does settle it, so it is handed
      # over on a pull_request and OMITTED on push/schedule, where there is no
      # merge base and the honest verdict is "unknown, here are both
      # remedies".
      #
      # A merge-base extraction that FAILS is a hard error, not a fallback to
      # the unknown branch: a checker that quietly stopped using its evidence
      # is this ticket's own shape one level up.
      - name: Assert every mirror matches the engine's pin
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          rc=0
          for mirror in tools/requirements-engine-pin.txt .github/requirements/pytorch.txt; do
            echo "::group::$mirror"
            base_arg=""
            if [ -n "${BASE_REF:-}" ]; then
              base_file="${RUNNER_TEMP:-/tmp}/$(basename "$mirror").base"
              merge_base="$(git merge-base "origin/$BASE_REF" HEAD)"
              # A mirror ADDED by this PR does not exist at the merge base.
              # That is determinate — the PR added the pin, so the PR moved —
              # and an empty base file derives exactly that, so it is written
              # rather than treated as a failure.
              git show "$merge_base:$mirror" > "$base_file" 2>/dev/null \
                || : > "$base_file"
              base_arg="--mirror-at-base $base_file"
            fi
            # A deliberate word-split, the same idiom as `${only:+--only $only}`
            # in the seed-contract job below, and preferred over an array
            # because `"${a[@]}"` on an EMPTY array is an unbound-variable
            # error under `set -u` in bash 3.2 — which is what the extracted
            # step runs under in tests/test_engine_pin_drift_guard.py on macOS.
            # shellcheck disable=SC2086
            # `--engine-root`, NOT A LIST OF `--engine` PATHS (internal ref).
            # Two things were wrong with the list. It was incomplete — it named
            # two of the engine's seven pin-carrying files and missed
            # `use_cases/requirements_vision_cv_cuda.txt` entirely — and the
            # checker reduced whatever it was given with `dict.update`, which
            # is last-write-wins, so the ORDER of these lines decided the
            # verdict whenever two sources disagreed. The same three files in a
            # different order produced a red and a green. Deriving the set
            # removes both: there is no order to get wrong and no list to keep
            # up to date, and a disagreement between engine sources is now
            # refused with exit 2 instead of resolved by argument position.
            python3 tools/check_engine_pin_drift.py \
              --mirror "$mirror" \
              --engine-root _engine_pin \
              $base_arg || rc=1
            echo "::endgroup::"
          done
          exit "$rc"

  # 2) Rebuild each shipped template under the engine pin and strict-load its
  #    staged dump. Fails closed on any KEY_MISMATCH / BUILD_FAIL / provenance
  #    drift. Runs only after the mirror is confirmed == the engine.
  verify-dumps:
    # `fetch-dump-manifest` (4a, below) is needed for the canonical manifest,
    # which this job now consumes as well as `dump-coverage` does — see the
    # download step for why that is safe in a job that runs PR code.
    needs: [engine-pin-drift-guard, fetch-dump-manifest]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # `id-token: write` IS SCOPED TO THIS JOB, never the workflow: it is what
    # lets the credential step below exchange GitHub's OIDC token for the
    # zoo-weights READ role. The two token-minting jobs above and below
    # (`fetch-engine-pin`, `fetch-dump-manifest`) and every other job keep the
    # workflow-level `contents: read` and cannot request an OIDC token at all.
    # A job-level block REPLACES the workflow-level one, so `contents: read` is
    # restated here or the checkout loses it.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # THE CANONICAL MANIFEST, AND IT MUST ARRIVE FIRST. Until this step
      # existed nothing in this job put a manifest.json in the checkout, so
      # every run took the "no manifest" branch by construction (the arming
      # overclaim). It is 4a's `dump-manifest` artifact — backend's
      # tools/offline_weights/manifest.json, the same file `dump-coverage`
      # gates on — landed at ./manifest.json, which is where the fetch hook
      # (`--staging .`) and the verifier (its `--manifest` default) both read.
      #
      # ORDER IS THE WHOLE CONSTRAINT. The install and credential steps below
      # are conditioned on `hashFiles('manifest.json')`, and `hashFiles` sees
      # only what is in the checkout when each condition is evaluated. A
      # download placed beside the fetch step — after the installs — would
      # leave them skipped while the manifest then exists, and the verifier
      # would die on `import torch` under the runner's bare python3.
      # tests/test_dump_fetch_guard.py used to forbid any download into this
      # job for exactly that reason; it now pins the narrower rule that makes
      # one safe: exactly one producer of the file, this one, ahead of every
      # step whose condition reads it.
      #
      # WHY AN ARTIFACT IN A PR-CODE JOB IS FINE HERE. The artifact is written
      # by 4a, which runs NO PR-controlled code, and it is the manifest alone —
      # never `_backend/.git`, never the token. This job only READS it. The
      # token boundary 4a exists for is unchanged: no backend credential ever
      # enters this job, exactly as for `dump-coverage`.
      - name: Download the dump manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dump-manifest
          path: .
      # THE INSTALL RUNS ONLY WHEN THE DUMPS WILL BE FETCHED. Its condition is
      # the credential step's, verbatim (tests/test_dump_fetch_guard.py holds
      # the three equal): with a manifest now always present, a condition on
      # the manifest alone would spend ~2 minutes on setup-python plus the
      # engine's pinned stack on every run while the store variables are unset,
      # for a verifier that then loads nothing. On that path the fetch step
      # names what is missing and the verifier runs in its `--dumps-not-fetched`
      # mode, which is stdlib-only by test — it parses the manifest and resolves
      # every live entry to its template, and imports nothing the install
      # provides.
      #
      # The condition decides ONLY whether to install. It makes no pass/fail
      # judgement and gates neither of the two steps that do: the fetch step
      # and the verifier still run on every path and still own the verdict.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: >-
          hashFiles('manifest.json') != ''
          && vars.TRACEBLOC_ZOO_WEIGHTS_URI != ''
          && vars.ZOO_WEIGHTS_READ_ROLE_ARN != ''
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements-engine-pin.txt
      # Install the engine's pinned stack (guard above proved it == the engine).
      # A failure here is a hard error, never a swallowed green (fail-closed).
      - run: pip install -r tools/requirements-engine-pin.txt
        if: >-
          hashFiles('manifest.json') != ''
          && vars.TRACEBLOC_ZOO_WEIGHTS_URI != ''
          && vars.ZOO_WEIGHTS_READ_ROLE_ARN != ''
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      # THE BUCKET IS PRIVATE, SO THE FETCH NEEDS CREDENTIALS, and until this
      # step existed the job had none: no AWS step, no AWS env, no secret, and
      # no `id-token` permission. Setting TRACEBLOC_ZOO_WEIGHTS_URI alone would
      # therefore not have armed anything — `aws s3 cp` would have died on
      # "Unable to locate credentials" the first time a manifest reached the
      # fetch branch. That is this gate's recurring shape (a precondition the
      # skip message does not name), so the credential is now a NAMED
      # precondition of its own, alongside the store URI.
      #
      # GitHub OIDC, not a stored key: nothing long-lived to leak or rotate.
      # The role comes from the repo variable ZOO_WEIGHTS_READ_ROLE_ARN. READ
      # ONLY on `zoo-weights/*` is sufficient — the fetch is `s3 cp` from the
      # store into ./dist, and uploads are not this workflow's job.
      #
      # WHO GETS CREDENTIALS. This job runs PR-controlled code (the fetch hook
      # and the verifier are the PR's own copies), and the credentials this
      # step exports are visible to every later step. So the step runs only on
      # a push, the schedule, a dispatch, or a pull request whose head is in
      # THIS repository; a fork's pull request is refused credentials and says
      # so by name. That is belt and braces rather than the whole boundary, and
      # it is worth being exact about which is which:
      #   * GitHub already withholds an OIDC token from a fork's pull_request
      #     (`id-token: write` is a write permission, and a fork gets a
      #     read-only token unless the repo opts in to sending write tokens
      #     to fork PRs), so the `if:` below makes the refusal explicit and
      #     keeps a fork run on a named SKIP instead of a failed assume;
      #   * a same-repo PR's author has write access and could edit this file,
      #     so no condition in it restrains them — that is the same trust this
      #     workflow already extends to the engine-pin job's App token;
      #   * the real bound is the role's trust policy, which should admit only
      #     `repo:tracebloc/model-zoo` subjects, and its read-only scope.
      # The job split `fetch-engine-pin` uses (a token job that runs no PR code)
      # is not reused here on purpose: its point is to hand the PR job FILES,
      # and the files here are only knowable from the manifest this job reads.
      #
      # THE CONDITION IS SPELLED TWICE, in the `if:` and in the fetch step's
      # ZOO_WEIGHTS_TRUSTED_EVENT, and the shell refuses the one disagreement
      # that matters: every precondition met but no credential step success is
      # a red, never a fetch attempted without credentials. The test suite
      # holds the two spellings equal.
      - name: Assume the zoo-weights read role
        id: zoo-weights-creds
        if: >-
          hashFiles('manifest.json') != ''
          && vars.TRACEBLOC_ZOO_WEIGHTS_URI != ''
          && vars.ZOO_WEIGHTS_READ_ROLE_ARN != ''
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ZOO_WEIGHTS_READ_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: model-zoo-verify-dumps
      # Obtain the staged dumps. They are NOT committed (served from the
      # tracebloc model store). The hosting decision is MADE: a private S3
      # bucket, content-addressed under `zoo-weights/` exactly as
      # tools/sync_zoo_weights.py lays it out, with users reaching their seeds
      # through the platform's presigned-URL route rather than the bucket.
      # tools/sync_zoo_weights.py is the fetch hook (an internal ticket refs)
      # and fetches the live entries' <base>_weights.pkl files into ./dist;
      # entries marked `"status": "retired"` are not fetched.
      #
      # Each precondition is reported BY NAME. The previous guard was a single
      # `[ -f manifest.json ] && [ -f tools/sync_zoo_weights.py ]`, which
      # attributed every no-op to hosting — including the case where the fetch
      # hook itself was not in the repo. It was: the tool existed only as an
      # uncommitted file on one laptop, so `-f` selected the no-op branch on
      # every run and printed a reassuring hosting message, which is why the
      # gap survived unnoticed (the arming overclaim). A missing tool, a missing
      # store URI, a missing read role and an untrusted event are different
      # problems and each says so.
      #
      # Still exit 0 in every skip branch: verify_dumps_against_engine_pin.py
      # owns the fail-closed decision, and duplicating that judgement here is
      # how the two drift apart. What this step hands the verifier instead is
      # the REASON, as the `not_fetched` output: set on every credential-side
      # skip, it puts the verifier in `--dumps-not-fetched` mode (parse and
      # resolve, load nothing, say SKIP). Unset — a fetch that ran, or the
      # no-sync-tool defect — the verifier sweeps dist/ and reports every
      # absent dump MISSING.
      #
      # ONE SCHEMA ACROSS BOTH TOOLS (the schema reconciliation). This step
      # and the verifier used to read the same manifest.json under different
      # keys, and no single-key manifest could take the job green: an
      # `entries`-keyed manifest fetched and then the verifier exited 2 on
      # "no `dumps` list"; a `dumps`-keyed one reddened `fetch-all` first.
      # Both sync_zoo_weights and verify_dumps_against_engine_pin now read the
      # canonical `entries` dict, the verifier refuses a `dumps` list by name,
      # and tests/test_dump_fetch_guard.py drives one schema-2 manifest
      # (live, retired and category-carrying entries) through both, in job
      # order.
      - name: Obtain staged dumps from the model store
        id: fetch-dumps
        env:
          # The store URI and the role are configuration, not literals here:
          # the bucket name is not this public repository's to publish. Unset
          # resolves to the empty string and selects the matching SKIP below.
          TRACEBLOC_ZOO_WEIGHTS_URI: ${{ vars.TRACEBLOC_ZOO_WEIGHTS_URI }}
          ZOO_WEIGHTS_READ_ROLE_ARN: ${{ vars.ZOO_WEIGHTS_READ_ROLE_ARN }}
          # `true` / `false`, never empty; anything else is a hard error below.
          ZOO_WEIGHTS_TRUSTED_EVENT: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          ZOO_WEIGHTS_CREDENTIALS: ${{ steps.zoo-weights-creds.outcome }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ ! -f manifest.json ]; then
            echo "SKIP (no manifest): no manifest.json in this checkout, so no"
            echo "  dumps are declared for verification here. In CI this is a"
            echo "  FAULT, not a pending state: the job's first step downloads"
            echo "  the dump-manifest artifact (backend tools/offline_weights) to"
            echo "  this path, so its absence means that download did not land"
            echo "  here. The verifier below runs with --require-manifest and"
            echo "  reddens on it (see the arming overclaim)."
          elif [ ! -f tools/sync_zoo_weights.py ]; then
            echo "SKIP (no sync tool): manifest.json declares dumps, but the"
            echo "  fetch hook tools/sync_zoo_weights.py is NOT in this checkout."
            echo "  This is a DEFECT in the repo, not a pending decision — the"
            echo "  hook is committed (the arming overclaim); restore it. The verifier"
            echo "  below will report every declared dump as MISSING."
          else
            case "${ZOO_WEIGHTS_TRUSTED_EVENT:-}" in
              true|false) ;;
              *)
                echo "::error::ZOO_WEIGHTS_TRUSTED_EVENT is '${ZOO_WEIGHTS_TRUSTED_EVENT:-}', not true/false — cannot tell whether this run may hold credentials, so refusing rather than guessing." >&2
                exit 1
                ;;
            esac
            # Every missing precondition is named, not just the first: an
            # admin reading one SKIP and fixing it should not discover the
            # next one only on the following run.
            missing=""
            if [ -z "${TRACEBLOC_ZOO_WEIGHTS_URI:-}" ]; then
              echo "SKIP (no store URI): TRACEBLOC_ZOO_WEIGHTS_URI is unset, so"
              echo "  there is nowhere to fetch from. This is not an open"
              echo "  question: the hosting decision is made (a private S3"
              echo "  bucket, prefix zoo-weights/). What remains is an admin"
              echo "  setting this repo variable to that prefix."
              missing="${missing:+$missing; }no store URI (TRACEBLOC_ZOO_WEIGHTS_URI unset)"
            fi
            if [ -z "${ZOO_WEIGHTS_READ_ROLE_ARN:-}" ]; then
              echo "SKIP (no read role): ZOO_WEIGHTS_READ_ROLE_ARN is unset, so"
              echo "  no AWS credentials can be assumed and the bucket is"
              echo "  private. What remains is an admin setting this repo"
              echo "  variable to a READ-ONLY role on zoo-weights/* whose OIDC"
              echo "  trust admits this repository."
              missing="${missing:+$missing; }no read role (ZOO_WEIGHTS_READ_ROLE_ARN unset)"
            fi
            if [ "$ZOO_WEIGHTS_TRUSTED_EVENT" != "true" ]; then
              echo "SKIP (fork pull request): this run's code comes from a"
              echo "  fork, and no AWS credentials are issued to it. The same"
              echo "  dumps are verified on the push to develop after merge and"
              echo "  on the weekday schedule."
              missing="${missing:+$missing; }fork pull request (no credentials issued)"
            fi
            if [ -z "$missing" ]; then
              if [ "${ZOO_WEIGHTS_CREDENTIALS:-}" != "success" ]; then
                echo "::error::every fetch precondition holds, but the 'Assume the zoo-weights read role' step's outcome is '${ZOO_WEIGHTS_CREDENTIALS:-}', not success. Its if: and this step's preconditions disagree; refusing to fetch a private bucket without credentials." >&2
                exit 1
              fi
              python3 tools/sync_zoo_weights.py --staging . fetch-all --dest dist
            else
              echo "not_fetched=$missing" >> "$GITHUB_OUTPUT"
            fi
          fi
      # The gate. Exits non-zero on any live dump that cannot strict-load into
      # its template under the engine pin, any built_with-vs-engine drift, any
      # live entry that maps to no template, or a manifest that is not the
      # canonical shape. `--require-manifest` because the first step always
      # supplies one: an absent manifest here is a fault, not "nothing to do".
      #
      # On a named skip (`not_fetched` set) it still parses the manifest and
      # resolves every live entry — red on a structural defect — but loads
      # nothing and prints SKIP (dumps not fetched) with the reason, which is
      # today's state while the two store variables are unset.
      - name: Verify the dumps against the engine pin
        env:
          DUMPS_NOT_FETCHED: ${{ steps.fetch-dumps.outputs.not_fetched }}
        run: |
          set -euo pipefail
          if [ -n "${DUMPS_NOT_FETCHED:-}" ]; then
            python3 tools/verify_dumps_against_engine_pin.py --require-manifest \
              --dumps-not-fetched "$DUMPS_NOT_FETCHED"
          else
            python3 tools/verify_dumps_against_engine_pin.py --require-manifest
          fi

  # 3) SEED_EXCLUDED_PREFIXES must keep agreeing with what the template BUILDS.
  #
  #    The constant is a literal, and a literal rots. `seed_contract.py apply`
  #    runs once, at authoring time; from then on the templates restate a
  #    derivation that nothing re-runs. Rename `fc.` to `head.`, add a layer, and
  #    the declaration is quietly wrong -- after which a seed either carries head
  #    weights it must not, or excludes keys that no longer exist. That is the
  #    failure the backbone-only contract exists to remove, coming back through
  #    the declaration instead of the load (Lukas, (internal ref)).
  #
  #    So the derivation is the CHECK rather than the authoring step. It runs
  #    under the ENGINE's pinned stack for the same reason `verify-dumps` does: a
  #    head's shape is decided by the libraries that build the module tree, so a
  #    derivation under any other stack describes a model nobody runs.
  #
  #    SCOPE IS DELIBERATE. Each template is BUILT TWICE, so re-deriving all 46
  #    every PR is ~92 model builds -- slow enough that people would route around
  #    it. A PR re-derives only the templates it TOUCHES, which is exactly where
  #    drift is introduced; the scheduled run re-derives everything, which is
  #    where a drift introduced any other way gets caught.
  seed-contract-drift:
    needs: engine-pin-drift-guard
    # 60, not 30, and the reason is the full-sweep path rather than the common
    # one. A PR touching a few templates finishes in minutes; a PR touching the
    # seed-contract TOOLING re-derives all ~140, and each is BUILT TWICE. That
    # measured ~30 minutes locally with a warm cache, which is exactly the
    # budget -- so the sweep this gate exists for would be the run that times
    # out, and a timeout reads as a broken gate rather than a slow one.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `git diff base...HEAD` needs the merge base, not a shallow tip.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements-engine-pin.txt
      # The drift guard above proved this mirror == the engine's live pin.
      - run: pip install -r tools/requirements-engine-pin.txt
      - name: Decide which templates to re-derive
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "reason=full sweep (${{ github.event_name }})" >> "$GITHUB_OUTPUT"
            echo "only=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="origin/${{ github.base_ref }}"
          changed="$(git diff --name-only "$base...HEAD")"
          # A change to the tooling can move EVERY answer, so it forces a full
          # sweep -- narrowing to touched templates there would be checking the
          # new tool against the files least likely to expose its bug.
          #
          # THE PIN COUNTS AS TOOLING, and missing that was a real hole (Bugbot):
          # a head's shape is decided by the LIBRARY VERSIONS that build the
          # module tree, so bumping `requirements-engine-pin.txt` can stale every
          # prefix while the dumps still strict-load at each template's default.
          # That PR triggers this workflow via `paths:` but touches no template,
          # so it would have exited "nothing to re-derive" and gone green on the
          # one change most able to invalidate the constants. The weekday sweep
          # would find it eventually; the PR that caused it would not.
          #
          # The workflow file is here for the same reason: editing the gate
          # should re-run the gate in full, not trust it narrowed correctly.
          if echo "$changed" | grep -qE '^(tools/(derive_seed_excluded|seed_contract|seed_index)\.py|tools/requirements-engine-pin\.txt|\.github/workflows/verify-dumps-engine-pin\.yml)$'; then
            echo "reason=full sweep (seed-contract tooling or engine pin changed)" >> "$GITHUB_OUTPUT"
            echo "only=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `|| true` because grep exits 1 on NO MATCH, and `pipefail` would
          # turn "this PR touches no template" into a failed job. `-e` on each
          # path drops templates the PR DELETED -- `--only` on a stem that no
          # longer exists makes the derivation exit 2.
          stems=""
          while IFS= read -r f; do
            [ -n "$f" ] && [ -e "$f" ] && stems="$stems $(basename "$f" .py)"
          done <<EOF
          $(echo "$changed" | grep -E '^model_zoo/[^/]+/pytorch/[^/]+\.py$' || true)
          EOF
          # DEDUPE ONLY IF THERE IS SOMETHING TO DEDUPE (Bugbot). Running the
          # empty string through `tr | sort -u | tr` yields a single SPACE, not
          # "", so `[ -z "$only" ]` never held and `${only:+--only $only}` still
          # emitted a bare `--only` -- which made a PR touching no template
          # re-derive the entire zoo, the exact opposite of this step's purpose.
          #
          # My first "proof" of this step printed "${stems## }", which strips the
          # leading space and so displayed [] for a value that was " ". The test
          # below asserts the RAW length instead.
          if [ -n "${stems// /}" ]; then
            stems="$(echo "$stems" | tr ' ' '\n' | sort -u | tr '\n' ' ')"
            stems="${stems# }"
            stems="${stems% }"
          else
            stems=""
          fi
          echo "reason=changed templates: ${stems:-none}" >> "$GITHUB_OUTPUT"
          echo "only=$stems" >> "$GITHUB_OUTPUT"
      - name: Re-derive and compare against the declared constants
        run: |
          set -euo pipefail
          echo "Scope: ${{ steps.scope.outputs.reason }}"
          only="${{ steps.scope.outputs.only }}"
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -z "$only" ] \
             && ! echo "${{ steps.scope.outputs.reason }}" | grep -q '^full sweep'; then
            echo "No template touched — nothing to re-derive."
            exit 0
          fi
          # $only is a deliberate word-split list of template stems.
          # shellcheck disable=SC2086
          python3 tools/derive_seed_excluded.py --zoo . --out seed_derived.json \
            ${only:+--only $only}
          python3 tools/seed_contract.py --zoo . check --verdict seed_derived.json

  # the hosting decision — THE COMPLEMENT DIRECTION. Every other gate in this workflow is
  # keyed on the dumps that exist and asks "are they good?". None asks "is there
  # one for every template that needs one?", so a template that was migrated but
  # never prepped passes them all BY BEING ABSENT, and trains from random init on
  # an edge while the migration's premise is that it does not. Two slipped
  # through exactly this way: `faster_rcnn_resnet` and, found by this gate,
  # `text_classification/bert_base_uncased`.
  #
  # DELIBERATELY INDEPENDENT OF THE ENGINE PIN, and of every other job here bar
  # its own manifest fetch. The check is template text and set arithmetic — no
  # torch, no transformers, no build — so it runs in seconds on stdlib alone.
  # Making it `needs:` a pin guard would let a slow or red pin hide a coverage
  # answer that does not depend on the pin at all.
  #
  # It DOES now `needs:` job 4a below, and that is not a walk-back of the line
  # above: 4a is a 10-second sparse checkout of one 9 KB JSON file, it carries
  # no torch and no pin, and the dependency exists to keep the `backend` token
  # out of this job rather than to order any work. The property being protected
  # is which job the token lives in, not how fast the answer arrives.
  # 4a) THE TOKEN LIVES IN ITS OWN JOB, and that split is the security boundary,
  #     not a tidiness preference. This job mints a `backend`-scoped App token
  #     and runs NO PR-controlled code; the coverage job below runs the
  #     PR-controlled checker and holds NO token. Collapsing the two lets a PR
  #     that edits `tools/check_dump_coverage.py` read private `backend`:
  #     `persist-credentials: false` keeps the token out of `_backend/.git/config`
  #     but NOT out of the runner's step-output files, so it is reachable from
  #     any code running in the same job.
  #
  #     This is exactly the `fetch-engine-pin` / `engine-pin-drift-guard` pair
  #     above, for the same reason and with the same shape — "the real isolation
  #     is that no PR code runs in this job". The first revision of (internal ref)
  #     armed the manifest read inside the coverage job and reintroduced the
  #     hazard that pattern exists to prevent; Cursor Bugbot caught it on a
  #     learned rule naming this repo's own token-split convention.
  fetch-dump-manifest:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Mint a backend-read token
        id: backend-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: backend
          permission-contents: read
      - name: Check out the dump manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/backend
          ref: develop
          token: ${{ steps.backend-token.outputs.token }}
          path: _backend
          # Belt and braces: don't persist the token into _backend/.git/config
          # either. The real isolation is that no PR code runs in this job.
          persist-credentials: false
          sparse-checkout: tools/offline_weights/manifest.json
          sparse-checkout-cone-mode: false
      # FAIL IF THE SPARSE CHECKOUT MATCHED NOTHING, here as well as in the
      # consumer. A miss would otherwise upload an empty artifact and the
      # failure would surface one job later as a confusing download error.
      - name: The manifest must actually be present
        run: test -s _backend/tools/offline_weights/manifest.json
      - name: Upload the dump manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dump-manifest
          # Only manifest.json — never _backend/.git — crosses to the
          # PR-controlled jobs. There are TWO consumers: `dump-coverage` (4b)
          # and `verify-dumps` (2), which lands it at ./manifest.json for the
          # fetch hook and the verifier. A single file, so the archive holds
          # `manifest.json` at its root.
          path: _backend/tools/offline_weights/manifest.json
          if-no-files-found: error
          retention-days: 1

  # 4b) The coverage answer itself. Runs the PR-controlled checker with NO token
  #     of any kind: the manifest arrives as an artifact from 4a, so even
  #     PR-modified code here has nothing to reach private `backend` with.
  dump-coverage:
    needs: fetch-dump-manifest
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # (internal ref) — THE ORPHAN HALF IS NOW ARMED, and the reason it had to be
      # is that eight orphans accumulated while it was not. `check_dump_coverage`
      # is fail-closed BOTH ways by its own docstring, but this step passed no
      # `--manifest`, so `have_inventory` was false and the orphan branch never
      # executed. THAT IS WHY A HUMAN HAD TO NOTICE the seven retired DETR seeds
      # and `mask_rcnn`: the guard written to catch exactly this was here, green,
      # and running only half of itself.
      #
      # The manifest lives in `backend`, not here, which is the whole reason it
      # was left out: the previous comment said "on hosting, add --manifest",
      # and hosting (the hosting decision) is not what supplies it — a cross-repo read
      # is. Job 4a performs that read; this job only consumes its artifact.
      #
      # STILL NO `--dumps-dir`: the store's blobs are not reachable from CI.
      # The hosting decision is made (a private S3 bucket under zoo-weights/);
      # what is not done is the upload, which waits on write access to that
      # bucket, and the two repo variables the verify-dumps job's fetch needs
      # (TRACEBLOC_ZOO_WEIGHTS_URI, ZOO_WEIGHTS_READ_ROLE_ARN). The
      # manifest is the right inventory to gate on anyway. It is the artifact a
      # PR review can see, and (internal ref) is what happens when it and the
      # store disagree: gate the reviewable side, and the store is reconciled to
      # it by `tools/offline_weights/prune_dumps.py`.
      - name: Download the dump manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dump-manifest
          path: _manifest
      # FAIL IF THE MANIFEST IS NOT THERE, rather than falling through to the
      # classification-only run. An artifact that silently arrived empty would
      # restore the exact unarmed state this step exists to end, and it would
      # read as green — which is the defect, not a degraded mode of it.
      - name: The manifest must actually be present
        run: test -s _manifest/manifest.json
      - name: Every migrated template accounts for its seed, and every dump a template
        run: |
          python3 tools/check_dump_coverage.py --zoo . \
            --manifest _manifest/manifest.json
