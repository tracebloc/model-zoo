      # left behind its own shipped code until someone noticed.
      #
      # An installation token has a budget that is not shared with a human's
      # interactive use and does not evaporate when that person rotates a token or
      # leaves. `owner:` makes it ORG-scoped; a repo-scoped token cannot write an
      # org ProjectV2.
      #
      # Minted BEFORE the extract step, because the extract step is its first
      # consumer ((internal ref)): `/commits/{sha}/pulls` needs `pull-requests: read`,
      # and the caller's `github.token` runs under the org default of restricted
      # `read` -- contents and packages only -- so under that token the read 403s
      # on every PRIVATE repo and succeeds on every public one. From .github#438
      # reaching `main` (2026-09-08 19:10 UTC) until this change, that was 100 % of
      # private-repo pushes: the fail-closed branch below did its job and no card
      # moved. A called workflow can only DOWNGRADE the caller's token, so the fix
      # is not a `permissions:` block here -- it is this token, which already
      # carries the grant. Gated on a tracked branch only: a push to an untracked
      # branch still mints nothing.
