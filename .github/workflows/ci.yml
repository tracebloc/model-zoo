name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  # `develop` only: main receives the release train's merge commits, whose tree a develop
  # push run already tested, and no protection on main reads this workflow's jobs.
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint and the Makefile's own tests run on pull requests only: a develop push repeats a
  # PR run's verdict on lint, and promotion PRs into staging and main still run this job.
  ruff:
    if: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: .github/requirements/lint.txt
      - run: pip install -r .github/requirements/lint.txt
      # `make lint`. The RULE SELECTION was the duplicated part:
      # `--select=F401,F821,E9` was written out here and again in the Makefile,
      # so widening the set in one place would have left the other checking the
      # narrower one — and a lint job that silently checks less than the
      # contributor's pre-push hook is the wrong way round.
      #
      # The pin is already single-source and stays that way: lint.txt declares
      # ruff==0.16.0, this step installs it, and `make setup` installs the same
      # file.
      - run: make lint
      # The Makefile's own behaviour tests (guard-toolchain, in throwaway repos).
      # Kept out of `make check` so a local quirk cannot block a push; run here so
      # they still run on every pull request.
      - run: make test-hooks

  # `pytest tests/` deselects the mutation rows (tests/mutation_selection.py), so
  # these three jobs run each guard's behaviour tests and not its rows. The rows
  # run weekly, through `make mutation-nightly` in mutation-nightly.yml.
  test-pytorch:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: .github/requirements/pytorch.txt
      - run: pip install -r .github/requirements/test.txt -r .github/requirements/pytorch.txt
      - run: pytest tests/ -v

  test-sklearn:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: .github/requirements/sklearn.txt
      - run: pip install -r .github/requirements/test.txt -r .github/requirements/sklearn.txt
      - run: pytest tests/ -v

  test-survival:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: .github/requirements/survival.txt
      - run: pip install -r .github/requirements/test.txt -r .github/requirements/survival.txt
      # Why MODEL_ZOO_FRAMEWORKS is set: see FRAMEWORKS_ENV in tests/test_model_contract.py.
      - run: pytest tests/ -v
        env:
          MODEL_ZOO_FRAMEWORKS: lifelines,scikit_survival

  # ── Every template uploads the way a user uploads it from a clone ──
  #
  # tests/test_sdk_upload_from_clone.py runs the released SDK's local upload
  # checks (no network) on each template's `upload` path from the index: a
  # one-file template's .py, a folder template's flat .zip. The SDK is pinned in
  # .github/requirements/sdk.txt and installed only here; the module skips in
  # every other job unless MODEL_ZOO_SDK_UPLOAD=1, and with it set a missing SDK
  # is a collection error, not a skip.
  sdk-upload:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            .github/requirements/pytorch.txt
            .github/requirements/sdk.txt
      - run: pip install -r .github/requirements/test.txt -r .github/requirements/sdk.txt
      - name: The pinned SDK's upload checks pass on every template as cloned
        env:
          MODEL_ZOO_SDK_UPLOAD: "1"
        run: pytest tests/test_sdk_upload_from_clone.py tests/test_template_memory.py -v

  # ── The category gate: model_zoo/ against the ingestor's published enum ──
  #
  # The zoo's category list is the set of directories under model_zoo/. The
  # platform's list is the `category` enum of the ingestor's published ingest
  # schema. tests/test_zoo_category_contract.py holds the tree to a VENDORED copy
  # of that enum in every test job above; these two jobs hold the vendored copy to
  # the producer RELEASE it pins (`generated_from.ref_tag`), because a check
  # against a stale vendored file agrees with itself. A tag, never a branch, so a
  # producer push cannot redden a pull request that changed nothing here;
  # category-drift.yml holds the copy to the producer's develop once a day.
  #
  # 1) The vendored enum must EQUAL the producer's, checked in the one job that
  #    can read the private producer. Two rules, both pinned by
  #    tests/test_ingest_schema_guard.py:
  #
  #    NOTHING THE PR CONTROLS RUNS HERE. The producer token sits in the
  #    runner's step-output files, readable by any code in the job, so the
  #    comparison runs `tools/` at the merge base (develop itself on push),
  #    extracted outside the checkout. The PR's vendored file is read as data.
  #
  #    NOTHING FROM THE PRODUCER LEAVES HERE. This repo is public, and so are
  #    its run logs and artifacts. The comparison's report names the
  #    producer's categories, so it goes to a file on the runner and the log
  #    gets one verdict.
  ingest-schema-guard:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `git merge-base` needs history, not a shallow tip: it is where the
          # trusted comparison is extracted from.
          fetch-depth: 0
          persist-credentials: false
      # THE PIN IS DATA: one field of the PR's vendored blob, read by jq rather
      # than by any code the PR controls, and refused unless it is a release tag
      # (RELEASE_TAG in tools/ingest_category_contract.py, held equal by
      # tests/test_ingest_schema_guard.py). jq prints it JSON-encoded and ASCII,
      # so a newline or a non-ASCII digit stays escaped and cannot match.
      - name: Read the producer release the vendored copy pins
        id: pin
        run: |
          set -euo pipefail
          vendored=tests/contracts/tracebloc_ingestor/ingest_categories.v1.json
          release='^"v[0-9]+\.[0-9]+\.[0-9]+"$'
          raw="$(git cat-file blob "HEAD:$vendored" | jq -ac '.generated_from.ref_tag' 2>/dev/null)" || raw=""
          if ! [[ $raw =~ $release ]]; then
            echo "::error file=$vendored::INGEST CATEGORY CHECK FAILED — $vendored pins no producer release (generated_from.ref_tag)"
            exit 1
          fi
          tag="${raw//\"/}"
          echo "producer release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Mint an ingestor-read token
        id: ingestor-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: data-ingestors
          permission-contents: read
      - name: Check out the producer's ingest schema
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/data-ingestors
          ref: refs/tags/${{ steps.pin.outputs.tag }}
          token: ${{ steps.ingestor-token.outputs.token }}
          path: _producer
          persist-credentials: false
          # EVERY CANDIDATE PATH, newest first -- the producer moved its schema
          # into a contracts/ package and not every branch has moved yet. A path
          # the checkout does not produce is that candidate's 404; the
          # comparison picks the newest present and refuses if none is.
          # Kept equal to CANDIDATE_PATHS in tools/ingest_category_contract.py
          # by tests/test_ingest_schema_guard.py. Leading slashes anchor the
          # patterns at the producer's root (non-cone patterns are
          # gitignore-style and would otherwise match at any depth).
          sparse-checkout: |
            /tracebloc_ingestor/contracts/schema/ingest.v1.json
            /tracebloc_ingestor/schema/ingest.v1.json
          sparse-checkout-cone-mode: false
      # THE VERDICT IS READ FROM THE EXIT STATUS ALONE: 0 agrees, 1 disagrees,
      # 2 could not read a schema. Python also exits 1 on an uncaught
      # exception, so a report holding a traceback is no verdict rather than a
      # drift. The comparison composes the tool's own helpers, so the merge
      # base's copy of each is what decides.
      - name: Assert the vendored category enum matches the producer's
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          vendored=tests/contracts/tracebloc_ingestor/ingest_categories.v1.json
          if [ -n "${BASE_REF:-}" ]; then
            trusted_rev="$(git merge-base "origin/$BASE_REF" HEAD)"
          else
            trusted_rev="$(git rev-parse HEAD)"
          fi
          work="$(mktemp -d "${RUNNER_TEMP:-/tmp}/ingest-schema.XXXXXX")"
          trusted="$work/checker"
          report="$work/report.log"
          mkdir -p "$trusted"
          git archive "$trusted_rev" tools | tar -x -C "$trusted"
          # The blob, never the working-tree path, which could be a symlink.
          git cat-file blob "HEAD:$vendored" > "$work/vendored.json"
          echo "category comparison: tools/ at $trusted_rev"
          status=0
          python3 -I - "$trusted/tools" _producer "$work/vendored.json" \
            > "$report" 2>&1 <<'PY' || status=$?
          import sys
          from pathlib import Path

          tools, producer, vendored = sys.argv[1:4]
          sys.path.insert(0, tools)
          import ingest_category_contract as gate

          try:
              rel, body = gate.select_from_tree(Path(producer))
              published = gate.categories_from(body, rel)
              ours = gate.load_vendored(Path(vendored))
          except gate.Refusal as refusal:
              print(refusal, file=sys.stderr)
              sys.exit(2)
          findings = gate.compare(published, ours, "the producer", "the vendored copy")
          for finding in findings:
              print(f"DRIFT: {finding}", file=sys.stderr)
          sys.exit(1 if findings else 0)
          PY
          if [ "$status" -eq 0 ]; then
            echo "ingest schema OK: $vendored matches the producer's category enum"
            exit 0
          elif [ "$status" -eq 1 ] && ! grep -q '^Traceback ' "$report"; then
            echo "::error file=$vendored::INGEST CATEGORY DRIFT — $vendored disagrees with the producer's category enum"
          else
            echo "::error file=$vendored::INGEST CATEGORY CHECK FAILED — no verdict for $vendored (exit $status)"
          fi
          echo "The report names the producer's categories, so it is not printed here."
          echo "To read it, run tools/ingest_category_contract.py with read access to the producer."
          exit 1

  # 2) The tree half, and the one check branch protection requires for both.
  #    It runs the PR's tests and holds no token. `if: !cancelled()` IS THE
  #    FAIL-CLOSED HALF: a job skipped because a job it `needs` failed reports
  #    SKIPPED, and a skipped check reads as passing. So this job runs whether
  #    or not the guard passed, and goes red unless the guard succeeded (a
  #    fork PR has no secrets; a revoked App; the producer unreachable; a
  #    drift). "Could not look" is red, never green.
  category-contract:
    needs: ingest-schema-guard
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      # Stdlib only beyond pytest, at test.txt's pin.
      - run: pip install -r .github/requirements/test.txt
      - name: model_zoo/ agrees with the vendored category enum
        run: pytest tests/test_zoo_category_contract.py -v
      # Offline: each copy against the producer commit and blobs it pins.
      - name: The vendored contract copies are held to their pins
        if: ${{ !cancelled() }}
        run: pytest tests/test_contract_copies_held.py -v
      # Runs even when the step above is red, so one run reports both layers.
      - name: The vendored category enum agrees with the producer release it pins
        if: ${{ !cancelled() }}
        env:
          GUARD_RESULT: ${{ needs.ingest-schema-guard.result }}
        run: |
          if [ "$GUARD_RESULT" != "success" ]; then
            echo "::error::ingest-schema-guard did not prove the vendored category enum equal to the producer release it pins (result: ${GUARD_RESULT:-none}); its log gives the verdict."
            exit 1
          fi
          echo "ingest-schema-guard: the vendored category enum equals the producer release it pins"

  # ── One required context for every job above ──
  #
  # Branch protection requires `ci-gate` alone, so a job added to or renamed in
  # `needs:` changes what is required without touching protection. `if: always()`
  # makes it report on every run: without it, a failed need SKIPS this job, and a
  # skipped check reads as passing. The judge is org-config's template, unchanged
  # (the audit compares its steps); a need that gains an `if:` skips on purpose.
  ci-gate:
    needs: [ruff, test-pytorch, test-sklearn, test-survival, sdk-upload, ingest-schema-guard, category-contract]
    if: always()
    runs-on: ubuntu-slim  # runner: hosted (ubuntu-slim)
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS"
          if [ -z "${RESULTS// /}" ]; then
            echo "::error::no needed job to judge -- a CI that runs nothing has no verdict"
            exit 1
          fi
          bad=0
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a needed job ended '$result'"; bad=1 ;;
            esac
          done
          exit "$bad"
