name: FR gate

# Reusable workflow. Called from each active repo on pull_request events
# targeting staging, main, or master. Blocks the merge unless every item
# included in the promotion is at or beyond the correct "Ready for X" column:
#
#   target = staging  → all items must be at "On dev" or later (automatic — D6)
#   target = main/master → all items must be at "Ready for prod" or later
#
# "or later": an item already further down the pipeline satisfies an earlier
# gate instead of being falsely blocked (`scripts/fr-gate-walk.sh` holds the
# stage order). A required status check via branch protection; the visible,
# audited override is the `skip-fr-gate` label. Items are discovered by
# commit->PR attribution (`commits/{sha}/pulls`) between base and head;
# (internal ref) promotion PRs are transparent plumbing; with no PRs found the
# promotion PR's own Status is checked (the walk script's `discover` mode).
#
# A (internal ref) release PR (a `release/` head on (internal ref) itself, into
# `main`) never enters FR on staging: its `release:approved` is its review, so
# the gate passes it on that label instead of walking ((internal ref) D126, D127).

on:
  pull_request:
    branches: [staging, main, master]
    types: [opened, reopened, synchronize, ready_for_review, edited, labeled, unlabeled]

permissions:
  contents: read
jobs:
  gate:
    name: gate / gate
    # THE BASE DECIDES ON THE JOB, NOT IN A STEP ((internal ref)): a job its `if:` skips takes
    # no runner. The caller's `branches:` is this list, so no run starts off these bases;
    # the `if:` still skips one that does, from a caller that carries no such filter.
    # This list and the `case` below are ONE rule in two spellings: the `case`
    # maps each base listed here to the Status it requires, and fails closed on
    # any other. fr-gate-selftest parses both and fails when they differ.
    if: contains(fromJSON('["staging", "main", "master"]'), github.base_ref)
    runs-on: ubuntu-slim  # runner: hosted (ubuntu-slim)
    # ubuntu-slim hard-caps a job at 15 minutes; a board read that takes longer
    # than this is a stuck read, and the cap would kill it without a message.
    timeout-minutes: 10
    steps:
      - name: Determine required Status from target branch
        id: target
        env:
          BASE: ${{ github.base_ref }}
        run: |
          case "$BASE" in
            staging)     echo "required=On dev" >> "$GITHUB_OUTPUT" ;;
            main|master) echo "required=Ready for prod"    >> "$GITHUB_OUTPUT" ;;
            *)           echo "::error::base '$BASE' passed the job's if: but has no required Status here; the two lists disagree, so the gate refuses rather than guessing."; exit 1 ;;
          esac

      - name: Check for skip-fr-gate label
        id: skip
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$LABELS" | grep -q '"skip-fr-gate"'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::FR gate bypassed via 'skip-fr-gate' label."
            # (promotion-shape guard below is also bypassed by this label)
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # THE RELEASE PR'S SHAPE ((internal ref) D126), as the release lane reads it: (internal ref)'s own
      # `release/` branch into `main`. Only the shape is read here; the label is judged below,
      # and anything else is walked as before.
      - name: Is this a frontend-app release PR?
        id: release-shape
        if: steps.skip.outputs.skip != 'true'
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_FULL: ${{ github.repository }}
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          why=""
          if [ "$REPO_NAME" != "frontend-app" ]; then why="the release lane is frontend-app's, not ${REPO_NAME:-an unread repository}'s"
          elif [ "$BASE" != "main" ]; then why="it targets '${BASE:-an unread base}', not 'main'"
          elif [[ "$HEAD_REF" != release/?* ]]; then why="its head '${HEAD_REF:-unread}' is not a 'release/' branch"
          elif [ "$HEAD_REPO" != "$REPO_FULL" ]; then why="its head is on '${HEAD_REPO:-an unread repository}', not on $REPO_FULL"
          fi
          if [ -n "$why" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Not a release PR ($why): the walk below judges it."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "A release PR ($HEAD_REF into main): its release:approved label is judged below, and no walk runs."
          fi

      - name: Promotion-shape guard — only the train promotes
        if: steps.skip.outputs.skip != 'true' && steps.release-shape.outputs.release != 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # Manual promotion PRs bypass the release train's Bugbot soft-gate,
          # its tagging, and its run records — and indirect-merge the train's
          # own PRs ((internal ref) / (internal ref), 2026-07-29). Promotions
          # into staging/main/master are the train's job. Sanctioned lanes:
          #   release-train/*       the train's own mirror PRs
          #   hotfix-backmerge/*    hotfix.yml's automated back-merges
          #   'hotfix' label        single-repo emergency fix (D14a, audited)
          #   'skip-fr-gate' label  full gate override (handled above, audited)
          #   (internal ref) release/ the release lane (D126): skipped above, judged on its label below
          case "$HEAD_REF" in
            release-train/*|hotfix-backmerge/*) exit 0 ;;
          esac
          if echo "$LABELS" | grep -q '"hotfix"'; then
            exit 0
          fi
          echo "::error::Manual promotion PRs are retired — promotions into this branch go through the org's release train (a maintainer dispatches its 'Release train' workflow). For a single-repo emergency prod fix use the 'hotfix' label; 'skip-fr-gate' remains the audited full override."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.skip.outputs.skip != 'true'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # THE LABEL'S THREE READS, for a release PR only: (internal ref)'s `readApproval` reads the PR's
      # labels and timeline (issues, pull-requests) and its branch's pushes (contents), on this
      # repository alone. Read-only; no fallback, so a short scope is "cannot tell" below.
      - name: Mint a read token for the release PR's label
        id: release-token
        if: steps.skip.outputs.skip != 'true' && steps.release-shape.outputs.release == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      # A RELEASE PR PASSES ON ITS LABEL ((internal ref) D127): `release:approved`, last applied by a login
      # (internal ref)'s `.github/release-approvers` names at the merge base, to this very head. Read as
      # the release lane reads it ((internal ref) hotfix-design-rules.mjs `labelOnHead`): (internal ref)'s
      # own `releaseApproval` and `readApproval`, from the MERGE BASE's scripts/, so a release PR cannot
      # rewrite its judge, and a push after the label voids it. No label, a stale one or a non-approver's
      # is a refusal (exit 1); anything unreadable is "cannot tell" (exit 3), as for the walk.
      # The judge below is run by `node`; the slim image's node is not guaranteed, so the caller's
      # `.nvmrc` names the version, as in mutation-nightly.yml. No `.nvmrc` leaves the image's node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.skip.outputs.skip != 'true' && steps.release-shape.outputs.release == 'true' && hashFiles('.nvmrc') != ''
        with:
          node-version-file: .nvmrc

      - name: A release PR passes on release:approved at its head
        id: release
        if: steps.skip.outputs.skip != 'true' && steps.release-shape.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          REPO_FULL: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cannot_tell() {
            echo "::error title=FR gate could not verify::FR gate could not verify -- $1. Re-run this check once it can be read."
            exit 3
          }
          git fetch --quiet --no-tags origin "+refs/heads/main:refs/remotes/origin/main" || cannot_tell "main cannot be fetched"
          base=$(git merge-base origin/main "$HEAD_SHA") || cannot_tell "the merge base of $HEAD_SHA and main cannot be read"
          code=$(mktemp -d) || cannot_tell "no temporary directory"
          git archive "$base" scripts | tar -x -C "$code" || cannot_tell "scripts/ cannot be read at the merge base $base"
          judge=$(mktemp -d)/judge.mjs || cannot_tell "no temporary directory"
          cat > "$judge" <<'JS'
          import { join } from 'node:path'
          import { pathToFileURL } from 'node:url'
          const [code, root, base, head, repo, pr, headRef] = process.argv.slice(2)
          const say = (word, why) => { console.log(`${word}\t${String(why).replace(/\s+/g, ' ')}`); process.exit(0) }
          const load = async (file) => {
            try { return await import(pathToFileURL(join(code, 'scripts', file)).href) } catch (err) {
              say('unknown', `frontend-app's scripts/${file} cannot be loaded at the merge base (${err.message})`)
            }
          }
          const gate = await load('release-gate.mjs')
          const approval = await load('label-approval.mjs')
          for (const [mod, file, name, type] of [[gate, 'release-gate.mjs', 'releaseApproval', 'function'],
            [gate, 'release-gate.mjs', 'onlyWaits', 'function'], [gate, 'release-gate.mjs', 'RELEASE_LABEL', 'string'],
            [approval, 'label-approval.mjs', 'readApproval', 'function']]) {
            if (typeof mod[name] !== type) say('unknown', `frontend-app's scripts/${file} exports no \`${name}\` at the merge base`)
          }
          const label = gate.RELEASE_LABEL
          let verdict
          try {
            verdict = gate.releaseApproval({ root, base, head,
              readRelease: () => approval.readApproval({ repo, pr, headRef, headRepo: repo, baseRepo: repo }) })
          } catch (err) { say('unknown', `\`${label}\` cannot be read (${err.message})`) }
          if (verdict === null || typeof verdict !== 'object' || typeof verdict.approved !== 'boolean') {
            say('unknown', `\`releaseApproval\` answered in a shape this gate does not read`)
          }
          if (verdict.approved !== true) say(gate.onlyWaits(verdict) ? 'refuse' : 'unknown', verdict.reason)
          if (verdict.labelled !== head) {
            say('refuse', `\`${label}\` was applied to ${verdict.labelled ?? 'a head that cannot be read'}, and the head is now ${head}: a push after the label voids it`)
          }
          say('pass', `a frontend-app release PR, released by ${verdict.by} (\`${label}\` applied to this head)`)
          JS
          verdict=$(node "$judge" "$code" "$PWD" "$base" "$HEAD_SHA" "$REPO_FULL" "$PR_NUMBER" "$HEAD_REF") || verdict=""
          case "$verdict" in
            pass$'\t'*)
              echo "release=pass" >> "$GITHUB_OUTPUT"
              echo "FR gate: ${verdict#*$'\t'}. Its label is its functional review, so no walk runs." ;;
            refuse$'\t'*)
              echo "::error title=FR gate release::${verdict#*$'\t'}. A release PR passes only on release:approved applied by an approver to its current head; a push after the label needs Release pressed again."
              exit 1 ;;
            unknown$'\t'*) cannot_tell "${verdict#*$'\t'}" ;;
            *) cannot_tell "the release judge printed no verdict" ;;
          esac

      # THE WALK LIVES HERE, NOT IN THE CALLING REPO ((internal ref), (internal ref) D6):
      # the release train needs the same walk to cut the prod hop at the FR
      # frontier, and a second copy would be the drift rule 9 forbids -- so the
      # script is checked out of this PRIVATE repo with a read-only App token,
      # minted from the (internal ref) App's id and key (RELEASE_TRAIN_APP_*);
      # `persist-credentials: false` because the walk reads with the wider App
      # token minted further below.
      - name: Mint a read-only token for org-config (private; the caller's own token cannot read it)
        id: org-config-token
        if: steps.skip.outputs.skip != 'true' && steps.release.outputs.release != 'pass'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: org-config
          permission-contents: read

      # THE TOOLS REF ((internal ref) D4, (internal ref)): `job.workflow_sha` is the commit
      # of THIS reusable file, so the scripts below are the ones it was reviewed
      # with; `tools-ref` overrides it for a test. An EMPTY ref would check out the
      # tools repo's DEFAULT branch fleet-wide, so it is refused. `toJSON(job)` because
      # actionlint's `job` schema (1.7.12) does not know `workflow_sha`.
      - name: Resolve the tools ref, refusing an empty one
        id: tools-ref
        if: steps.skip.outputs.skip != 'true' && steps.release.outputs.release != 'pass'
        env:
          TOOLS_REF: ${{ 'main' }}
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          if [ -z "$TOOLS_REF" ]; then
            case "$JOB_CONTEXT" in
              *'"workflow_sha"'*) TOOLS_REF="${JOB_CONTEXT#*\"workflow_sha\": \"}"; TOOLS_REF="${TOOLS_REF%%\"*}" ;;
            esac
          fi
          if ! [[ "$TOOLS_REF" =~ ^[0-9a-f]{40}$ || ( -n "$TOOLS_REF" && "$TOOLS_REF" != *[![:alnum:]._/-]* ) ]]; then
            echo "::error::the tools ref is empty or not a ref (${TOOLS_REF:-<empty>}); an empty ref would check out the tools repo's default branch instead of the commit this workflow was pinned at. Refusing."
            exit 1
          fi
          echo "ref=$TOOLS_REF" >> "$GITHUB_OUTPUT"
          echo "tools ref: $TOOLS_REF"
      - name: Check out the shared walk script
        if: steps.skip.outputs.skip != 'true' && steps.release.outputs.release != 'pass'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tracebloc/org-config
          token: ${{ steps.org-config-token.outputs.token }}
          ref: ${{ 'main' }}
          path: .org-config-tools
          persist-credentials: false

      # Authenticates as the tracebloc-release-train App ((internal ref)), ORG-scoped
      # by `owner:` because it reads the org PROJECT. READ-ONLY: `commits/{sha}/pulls`,
      # `compare/{base}...{head}` and the ProjectV2 graphql; it never writes a card, a
      # label or a comment. Gated behind the same `if:` as the steps that use it, so
      # a skipped PR mints nothing. NO FALLBACK TO A PAT: this gate blocking wrongly
      # is far better than it passing wrongly.
      - name: Mint an installation token
        id: app-token
        if: steps.skip.outputs.skip != 'true' && steps.release.outputs.release != 'pass'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # THREE READS AND NOTHING ELSE ((internal ref)), derived from the calls the
          # comment above names -- checked rather than guessed:
          #   commits/{sha}/pulls      -> contents: read + pull-requests: read
          #   compare/{base}...{head}  -> contents: read
          #   ProjectV2 graphql        -> organization-projects: read
          # The checkout above is on the job's GITHUB_TOKEN, not this token. IF THIS
          # SCOPE IS SHORT the gate fails closed and blocks promotions -- loud,
          # immediate and recoverable with the `skip-fr-gate` label, the failure
          # direction this gate already chose for itself.
          permission-contents: read
          permission-pull-requests: read
          permission-organization-projects: read

      - name: Discover items in this promotion
        id: items
        if: steps.skip.outputs.skip != 'true' && steps.release.outputs.release != 'pass'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO_FULL: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Make the base branch tip available locally for the diff.
          git fetch origin "$BASE_REF":"refs/remotes/origin/$BASE_REF" --depth=200 2>/dev/null || true
          BASE_SHA=$(git rev-parse "origin/$BASE_REF")
          export BASE_SHA
          # Attribution, promotion-PR transparency, the two-pass merge handling
          # (Bugbot on (internal ref), (internal ref)) and the file count live
          # in the script, shared with the train; it writes prs= / unattributed= / changed_files=.
          bash .org-config-tools/scripts/fr-gate-walk.sh discover

      - name: Verify each item is in required Status
        if: steps.skip.outputs.skip != 'true' && steps.release.outputs.release != 'pass'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ 'tracebloc' }}
          PROJECT_NUMBER: ${{ 2 }}
          REPO_FULL: ${{ github.repository }}
          REQUIRED: ${{ steps.target.outputs.required }}
          PRS: ${{ steps.items.outputs.prs }}
          UNATTRIB: ${{ steps.items.outputs.unattributed }}
          PROMOTION_PR: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ steps.items.outputs.changed_files }}
        run: |
          # The rank() ordering, resolve_status's race-aware retries and the
          # fail-closed verdict (blocked / missing / unreadable / unattributable
          # all block) are the script's `verify` mode. Same text, same exit code.
          bash .org-config-tools/scripts/fr-gate-walk.sh verify
