# house-rules config — tracebloc/model-zoo
#
# ONE FILE, TWO READERS, each ignoring the other's directives:
#   - the org house-rules.sh grep-lint (`rule:` lines) — none in this repo yet.
#   - the dead-weight checker (RFC-0087 D3) — the `indirect-use:` line below,
#     run in the same house-rules job. Armed hard here: the code-quality
#     workflow's dead-weight step sets SOFT_FAIL false, so a new unimported pin
#     reddens the required house-rules job.
#
# The reason names the path by which the distribution is reached; the checker
# refuses a reason under three words.

# scipy is reached from transformers, not from this repo: Mask2FormerLoss and
# OneFormerLoss call requires_backends(self, ["scipy"]) at CONSTRUCTION, and the
# pytorch instantiation test builds semantic_segmentation/pytorch/mask2former.py
# and oneformer.py, which raise ImportError without it. It arrives transitively
# via scikit-learn and is deliberately unpinned (the engine never names it). The
# full argument is in the comment above the pin in .github/requirements/pytorch.txt.
indirect-use: scipy | transformers Mask2FormerLoss/OneFormerLoss call requires_backends(["scipy"]) at construction; the pytorch instantiation test builds mask2former and oneformer
